name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**.md'
  pull_request:
    paths-ignore:
      - docs/**
      - '**.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenCV and LLVM
        shell: pwsh
        run: |
          choco install opencv llvm -y
          $opencvDir = (Get-ChildItem "C:\tools\opencv\build" -Directory | Select-Object -First 1).FullName
          if (-not $opencvDir) { $opencvDir = "C:\tools\opencv\build" }
          echo "OPENCV_LINK_PATHS=$opencvDir\x64\vc16\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENCV_LINK_LIBS=opencv_world4100" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENCV_INCLUDE_PATHS=$opencvDir\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $libFile = Get-ChildItem "$opencvDir\x64" -Recurse -Filter "opencv_world*.lib" | Select-Object -First 1
          if ($libFile) {
            echo "OPENCV_LINK_PATHS=$($libFile.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "OPENCV_LINK_LIBS=$($libFile.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $dllFile = Get-ChildItem "$opencvDir\x64" -Recurse -Filter "opencv_world*.dll" | Select-Object -First 1
          if ($dllFile) {
            Copy-Item $dllFile.FullName -Destination "."
          }
      - name: Build ZapFast release
        run: cargo build --release
      - name: Package ZapFast Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "target\release\zapfast.exe" -Destination "dist\"
          if (Test-Path "opencv_world*.dll") {
            Copy-Item "opencv_world*.dll" -Destination "dist\"
          }
      - name: Upload zapfast.exe
        uses: actions/upload-artifact@v7
        with:
          name: zapfast-windows-obs
          path: dist/*
